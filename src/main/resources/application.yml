spring:
  application:
    name: voltahome-portal
  datasource:
    url: jdbc:h2:mem:voltahome;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always                # schema.sql creates the tables, data.sql fills them
  jpa:
    open-in-view: false           # no database session kept open for the whole request
    hibernate:
      ddl-auto: validate          # Hibernate never creates or changes a table; it checks that the entities match
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP   # Instant fields are stored in plain TIMESTAMP columns

# itsme configuration — see README "Configuration".
# Endpoints are static (proxies and firewalls are configured in advance).
# The discovery document is only used to VERIFY these values (ItsmeDiscoveryCheck).
itsme:
  client-id: ${ITSME_CLIENT_ID:demo-client}
  client-secret: ${ITSME_CLIENT_SECRET:}                    # required, at least 32 bytes; injected from a vault (README "Client authentication")
  service-code: ${ITSME_SERVICE_CODE:VOLTAHOME_LOGIN}
  redirect-uri: ${ITSME_REDIRECT_URI:https://portal.voltahome.example/login/oauth2/code/itsme}
  acr: http://itsme.services/v2/claim/acr_advanced
  endpoints:
    issuer: ${ITSME_ISSUER:https://idp.e2e.itsme.services/v2}   # copy the exact value from the discovery document
    authorization-uri: https://idp.e2e.itsme.services/v2/authorization
    token-uri: https://idp.e2e.itsme.services/v2/token
    jwk-set-uri: ${ITSME_JWKS_URI:https://idp.e2e.itsme.services/v2/REPLACE-WITH-jwks_uri-FROM-DISCOVERY}
    discovery-uri: https://idp.e2e.itsme.services/v2/.well-known/openid-configuration
  proxy:
    host: ${OUTBOUND_PROXY_HOST:}                            # empty = direct connection
    port: ${OUTBOUND_PROXY_PORT:0}
  confirmation:                                              # README "Confirmation of an operation"
    service-code: ${ITSME_CONFIRMATION_SERVICE_CODE:VOLTAHOME_CONFIRM}   # registered at itsme as a Confirmation service
    redirect-uri: ${ITSME_CONFIRMATION_REDIRECT_URI:https://portal.voltahome.example/itsme/confirmation/callback}

# Where the backend sends the browser back to the SPA at the end of an itsme flow. The login hand-over URL gets a
# one-time code in the fragment (#handover=..., README: "Hand-over"), and so does the confirmation hand-over URL
# (#confirmation=...); the error URLs get ?error=<code>.
# Fixed configuration, never taken from a request (no open redirect).
app:
  login-handover-url: /
  login-error-url: /login-error
  confirmation-handover-url: /
  confirmation-error-url: /confirmation-error

logging:
  level:
    org.springframework.security: INFO   # never DEBUG/TRACE in production (tokens and principals may be printed)

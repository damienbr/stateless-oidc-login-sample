<!doctype html>
<!--
  DEMO ONLY. Stands in for the application's single page application (SPA). README: "Hand-over" explains the three
  steps; docs/spa-handover.md is the guide for the SPA developer.
  - No cookie: the token from the hand-over is kept in sessionStorage and sent as "Authorization: Bearer".
  - Before each itsme flow, a random browser code verifier is kept in sessionStorage, and only its S256 hash, the
    browser code challenge, is sent at the start. Redeeming the one-time code from the URL fragment requires the
    verifier itself: it binds the end of the flow to this browser. (Not PKCE's code_verifier: that one stays between
    the backend and itsme.)
  - Server data is always written with textContent, never as HTML.
  - After a confirmation, the SPA reloads the confirmed record from the API, by the type and reference the redemption
    returns. Nothing about the order or offer is kept in the browser during the itsme round trip.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoltaHome</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  button { padding: .6rem 1.1rem; background: #2e7d32; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .error { color: #a00; } .notice { color: #2e7d32; }
  th { text-align: left; padding-right: 1rem; }
</style>
</head>
<body>
<h1>VoltaHome</h1>
<p id="message" hidden></p>

<section id="home" hidden>
  <p>Customer portal of a fictitious energy supplier.</p>
  <!-- Step 1 of the login: a form POST to the backend, which sends the browser on to itsme -->
  <form method="post" action="/oauth2/authorization/itsme" id="login-form">
    <input type="hidden" name="browser_code_challenge" id="login-challenge">
    <button type="submit">Log in with itsme</button>
  </form>
  <p><small>For customers whose itsme account is already linked to their VoltaHome account.</small></p>
</section>

<section id="portal" hidden>
  <p id="welcome"></p>
  <table>
    <tr><th>Customer number</th><td id="customer-id"></td></tr>
    <tr><th>Authentication level</th><td id="level"></td></tr>
    <tr><th>Token expires at</th><td id="expires-at"></td></tr>
  </table>
  <h2>Orders and offers</h2>
  <p>You approve each one in the itsme app.</p>
  <ul id="operations"></ul>
  <ul id="confirmed"></ul>
  <p><button type="button" id="logout">Log out</button></p>
</section>

<script>
'use strict';

const TOKEN = 'voltahome.token';                     // sessionStorage: this tab only, gone when the tab closes
const VERIFIER = 'voltahome.browser-code-verifier';  // sessionStorage: one flow per tab, flows in other tabs untouched

// README: "Error codes". Fixed messages only: the raw "error" parameter comes from the URL and is never displayed.
const MESSAGES = {
  access_denied: 'Cancelled in itsme. Nothing was changed.',
  authorization_request_not_found: 'Your session has expired. Please try again.',
  confirmation_not_found: 'This confirmation has expired or was already used. Nothing was changed.',
  invalid_grant: 'Your session has expired. Please try again.',
  invalid_request: 'This could not be started from this page. Please try again.',
  invalid_handover: 'This could not be completed in this browser. Please try again.',
  not_linked: 'This itsme account is not linked to a VoltaHome account.',
  no_customer: 'This VoltaHome account is no longer active.',
  wrong_customer: 'This confirmation was not started by you. Nothing was changed.',
  wrong_person: 'The itsme account used is not the one linked to your VoltaHome account. Nothing was changed.',
  operation_not_found: 'This operation does not exist or can no longer be confirmed. Nothing was changed.',
  unknown_operation: 'This operation cannot be confirmed. Nothing was changed.'
};

// README: "Several operations, one callback". Where the SPA reloads a confirmed record, by its type.
const RECORDS = { order: '/api/orders/', offer: '/api/offers/' };

const $ = id => document.getElementById(id);
const show = (text, kind) => { $('message').textContent = text; $('message').className = kind; $('message').hidden = false; };
const showError = code => show(MESSAGES[code] || 'An error occurred. Please try again.', 'error');

// Storage can be blocked (private mode, settings): then the flow fails cleanly instead of throwing
function read(store, key) { try { return store.getItem(key); } catch (e) { return null; } }
function write(store, key, value) { try { value === null ? store.removeItem(key) : store.setItem(key, value); } catch (e) { } }

const base64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

/**
 * A new browser code verifier (256 random bits), kept until the end of the flow.
 * Returns its browser code challenge, the S256 hash: the only part sent at the start.
 */
async function newBrowserCodeChallenge() {
  const verifier = base64url(crypto.getRandomValues(new Uint8Array(32)));
  write(sessionStorage, VERIFIER, verifier);
  return base64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
}

/** The browser code verifier of this tab, used once. */
function takeVerifier() {
  const verifier = read(sessionStorage, VERIFIER);
  write(sessionStorage, VERIFIER, null);
  return verifier;
}

async function api(method, path, body) {
  const headers = { 'Accept': 'application/json' };
  const token = read(sessionStorage, TOKEN);
  if (token) { headers['Authorization'] = 'Bearer ' + token; }
  if (body) { headers['Content-Type'] = 'application/json'; }
  const response = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  return { status: response.status, data: await response.json().catch(() => ({})) };
}

// ---------------------------------------------------------------- login

// Step 1: compute the challenge first (it takes a moment), then submit the form
$('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  $('login-challenge').value = await newBrowserCodeChallenge();
  event.target.submit();                             // submit() does not fire this listener again
});

// Step 3: the backend sent the browser back to "/#handover=<code>"
async function redeemLogin(code) {
  const { status, data } = await api('POST', '/itsme/login/handover', { handover: code, browserCodeVerifier: takeVerifier() });
  if (status !== 200) { showError(data.error); return; }
  write(sessionStorage, TOKEN, data.accessToken);
}

// ---------------------------------------------------------------- confirmation

// Step 1: each button has its own start endpoint (the API decides the type and builds the text). The API returns
// the itsme URL; the token stays in sessionStorage during the round trip, and nothing else is kept.
async function startConfirmation(action) {
  const challenge = await newBrowserCodeChallenge();
  const { status, data } = await api('POST', action, { browserCodeChallenge: challenge });
  if (status === 200) { location.assign(data.redirect); } else { showError(data.error); }
}

// Step 3: the backend sent the browser back to "/#confirmation=<code>". Redeeming executes the operation; the answer
// says which one, and the SPA reloads that record from the API to show it as it is now.
async function redeemConfirmation(code) {
  const { status, data } = await api('POST', '/api/confirmation/redeem', { handover: code, browserCodeVerifier: takeVerifier() });
  if (status === 401) { show('Your session has expired. Nothing was changed.', 'error'); return; }
  if (status !== 200) { showError(data.error); return; }
  const path = RECORDS[data.operationType];
  const record = path ? await api('GET', path + encodeURIComponent(data.operationReference)) : { status: 404 };
  if (record.status === 200) {
    show('Confirmed: ' + record.data.description + ' (' + record.data.status.toLowerCase() + ').', 'notice');
  } else {
    show('The operation was confirmed.', 'notice');
  }
}

// ---------------------------------------------------------------- pages

async function showPortal() {
  const { status, data } = await api('GET', '/api/portal');
  if (status !== 200) { write(sessionStorage, TOKEN, null); $('home').hidden = false; return; }   // expired or forged
  $('welcome').textContent = 'Welcome, ' + data.displayName + '.';
  $('customer-id').textContent = data.customerId;
  $('level').textContent = data.authenticationLevel;
  $('expires-at').textContent = data.expiresAt;
  for (const operation of data.operations) {
    const li = document.createElement('li');
    li.textContent = operation.description + ' ';
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = operation.label;
    button.addEventListener('click', () => startConfirmation(operation.action));
    li.appendChild(button);
    $('operations').appendChild(li);
  }
  for (const c of data.confirmed) {
    const li = document.createElement('li');
    li.textContent = 'Confirmed: ' + c.operationType + ' ' + c.operationReference + ' (' + c.confirmedAt + ')';
    $('confirmed').appendChild(li);
  }
  $('portal').hidden = false;
}

$('logout').addEventListener('click', () => { write(sessionStorage, TOKEN, null); location.assign('/'); });

async function start() {
  // The one-time code arrives in the URL fragment: read it, then remove it from the address bar and the history
  const fragment = new URLSearchParams(location.hash.slice(1));
  if (location.hash) { history.replaceState(null, '', location.pathname + location.search); }
  const error = new URLSearchParams(location.search).get('error');

  if (fragment.has('handover')) { await redeemLogin(fragment.get('handover')); }
  if (fragment.has('confirmation')) { await redeemConfirmation(fragment.get('confirmation')); }
  if (error) { showError(error); }                   // /login-error?error=... or /confirmation-error?error=...

  if (read(sessionStorage, TOKEN)) { await showPortal(); } else { $('home').hidden = false; }
}

start();
</script>
</body>
</html>
